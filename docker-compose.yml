services:
  db:
    image: postgres:16-alpine
    container_name: ceara-nautica-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cearanautica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cearanautica_dev}
      POSTGRES_DB: ${POSTGRES_DB:-cearanautica}
    ports:
      - '5433:5432'
    volumes:
      - ceara_nautica_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-cearanautica}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ceara_nautica_pg:
